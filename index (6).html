<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repertório - Backtracks e Ensaios</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-color: #bb86fc;
            --secondary-color: #03dac6;
            --danger: #cf6679;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --border: #2c2c2c;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 700px; }

        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: var(--primary-color); margin-bottom: 5px; }
        header p { color: var(--text-muted); font-size: 0.95rem; margin-top: 0; }

        .song-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }

        .song-title {
            font-size: 1.4rem;
            margin: 0 0 15px;
            color: #ffffff;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .instruments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-instrument {
            background-color: #2c2c2c;
            color: var(--text-main);
            border: none;
            padding: 12px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            text-align: center;
        }
        .btn-instrument:hover { background-color: #383838; transform: translateY(-2px); }
        .btn-instrument.active {
            background-color: var(--primary-color);
            color: #121212;
            box-shadow: 0 0 10px rgba(187, 134, 252, 0.4);
        }

        .sub-group {
            background: #161616;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px dashed #333;
            display: none;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .sub-group.show { display: flex; }
        .sub-group span {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: bold;
            min-width: 80px;
        }

        .btn-sub {
            background-color: #262626;
            color: var(--text-main);
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        .btn-sub:hover { background-color: #333; }
        .btn-sub.active {
            background-color: var(--secondary-color);
            color: #121212;
            border-color: var(--secondary-color);
            font-weight: bold;
        }

        .player-section {
            background: #181818;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .player-status {
            font-size: 0.85rem;
            color: var(--secondary-color);
            margin-bottom: 8px;
            font-weight: 600;
        }
        .player-status.warn { color: var(--danger); }
        .btn-ouvir {
            display: none;
            background-color: var(--secondary-color);
            color: #121212;
            text-decoration: none;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .btn-ouvir.show { display: inline-block; }
        .btn-ouvir:hover { filter: brightness(1.1); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Repertório para Ensaio</h1>
            <p>Selecione seu instrumento para ensaiar com a trilha dedicada</p>
        </header>

        <div id="lista-musicas"></div>
    </div>

    <script>
        /* =====================================================================
           REPERTÓRIO
           Para adicionar, remover ou trocar músicas, edite esta lista.
           Estrutura de cada música:
             { nome: '...', links: {
                 canto: '',
                 violao: '',  violao_isolado: '',
                 cajon: '',   cajon_isolado: '',
                 baixo: '',   baixo_isolado: ''
             } }
           ===================================================================== */
        const REPERTORIO = [
            {
                nome: 'Vim para adorar-te',
                links: {
                    canto:          'https://archive.org/download/vim-para-adorar-te-1_sem_voz/vim-para-adorar-te-1_sem_voz.mp3',
                    violao:         'https://archive.org/download/vim-para-adorar-te-1_sem_voz/vim-para-adorar-te-1_sem_violao.mp3',
                    violao_isolado: 'https://archive.org/download/vim-para-adorar-te-1_sem_voz/vim-para-adorar-te-1_violao_isolado.mp3',
                    cajon:          'https://archive.org/download/vim-para-adorar-te-1_sem_voz/vim-para-adorar-te-1_sem_bateria.mp3',
                    cajon_isolado:  'https://archive.org/download/vim-para-adorar-te-1_sem_voz/vim-para-adorar-te-1_bateria_isolada.mp3',
                    baixo:          'https://archive.org/download/vim-para-adorar-te-1_sem_voz/vim-para-adorar-te-1_sem_baixo.mp3',
                    baixo_isolado:  'https://archive.org/download/vim-para-adorar-te-1_sem_voz/vim-para-adorar-te-1_baixo_isolado.mp3'
                }
            },
            {
                nome: 'Espírito, enche a minha vida',
                links: {
                    canto:          'https://archive.org/download/vim-para-adorar-te-1_sem_voz/esp%C3%ADrito_enche_a_minha_vida_sem_voz.mp3',
                    violao:         'https://archive.org/download/vim-para-adorar-te-1_sem_voz/esp%C3%ADrito_enche_a_minha_vida_sem_violao.mp3',
                    violao_isolado: 'https://archive.org/download/vim-para-adorar-te-1_sem_voz/esp%C3%ADrito_enche_a_minha_vida_mixdown_viol%C3%A3o_isolado.mp3',
                    cajon:          'https://archive.org/download/vim-para-adorar-te-1_sem_voz/esp%C3%ADrito_enche_a_minha_vida_sem_bateria.mp3',
                    cajon_isolado:  'https://archive.org/download/vim-para-adorar-te-1_sem_voz/esp%C3%ADrito_enche_a_minha_vida_bateria_isolada.mp3',
                    baixo:          'https://archive.org/download/vim-para-adorar-te-1_sem_voz/esp%C3%ADrito_enche_a_minha_vida_sem_baixo.mp3',
                    baixo_isolado:  'https://archive.org/download/vim-para-adorar-te-1_sem_voz/esp%C3%ADrito_enche_a_minha_vida_baixo_isolado.mp3'
                }
            },
            {
                nome: 'Eternamente Deus',
                links: {
                    canto:          'https://archive.org/download/vim-para-adorar-te-1_sem_voz/novo-canto-eternamente-deus-ao-vivo-1_sem_voz.mp3',
                    violao:         'https://archive.org/download/vim-para-adorar-te-1_sem_voz/novo-canto-eternamente-deus-ao-vivo-1_sem_violao.mp3',
                    violao_isolado: 'https://archive.org/download/vim-para-adorar-te-1_sem_voz/novo-canto-eternamente-deus-ao-vivo-1_violao_isolado.mp3',
                    cajon:          'https://archive.org/download/vim-para-adorar-te-1_sem_voz/novo-canto-eternamente-deus-ao-vivo-1_sem_bateria.mp3',
                    cajon_isolado:  'https://archive.org/download/vim-para-adorar-te-1_sem_voz/novo-canto-eternamente-deus-ao-vivo-1_bateria_isolada.mp3',
                    baixo:          'https://archive.org/download/vim-para-adorar-te-1_sem_voz/novo-canto-eternamente-deus-ao-vivo-1_sem_baixo.mp3',
                    baixo_isolado:  'https://archive.org/download/vim-para-adorar-te-1_sem_voz/novo-canto-eternamente-deus-ao-vivo-1_baixo_isolado.mp3'
                }
            },
            {
                nome: 'Nosso Deus é poderoso',
                links: {
                    canto:          'https://archive.org/download/vim-para-adorar-te-1_sem_voz/nosso_deus_e_poderoso_sem_voz.mp3',
                    violao:         'https://archive.org/download/vim-para-adorar-te-1_sem_voz/nosso_deus_e_poderoso_sem_violao.mp3',
                    violao_isolado: 'https://archive.org/download/vim-para-adorar-te-1_sem_voz/nosso_deus_e_poderoso_violao_isolado.mp3',
                    cajon:          'https://archive.org/download/vim-para-adorar-te-1_sem_voz/nosso_deus_e_poderoso_sem_bateria.mp3',
                    cajon_isolado:  'https://archive.org/download/vim-para-adorar-te-1_sem_voz/nosso_deus_e_poderoso_bateria_isolado.mp3',
                    baixo:          'https://archive.org/download/vim-para-adorar-te-1_sem_voz/nosso_deus_e_poderoso_sem_baixo.mp3',
                    baixo_isolado:  'https://archive.org/download/vim-para-adorar-te-1_sem_voz/nosso_deus_e_poderoso_baixo_isolado.mp3'
                }
            },
            {
                nome: 'Poderoso Deus',
                links: {
                    canto:          'https://archive.org/download/poderoso_deus_ao_vivo_2024_-_antonio_cirilo_sem_voz/poderoso_deus_ao_vivo_2024_-_antonio_cirilo_sem_voz.mp3',
                    violao:         'https://archive.org/download/poderoso_deus_ao_vivo_2024_-_antonio_cirilo_sem_voz/poderoso_deus_ao_vivo_2024_-_antonio_cirilo_sem_violao.mp3',
                    violao_isolado: 'https://archive.org/download/poderoso_deus_ao_vivo_2024_-_antonio_cirilo_sem_voz/poderoso_deus_ao_vivo_2024_-_antonio_cirilo_violao_isolado.mp3',
                    cajon:          'https://archive.org/download/poderoso_deus_ao_vivo_2024_-_antonio_cirilo_sem_voz/poderoso_deus_ao_vivo_2024_-_antonio_cirilo_sem_bateria.mp3',
                    cajon_isolado:  'https://archive.org/download/poderoso_deus_ao_vivo_2024_-_antonio_cirilo_sem_voz/poderoso_deus_ao_vivo_2024_-_antonio_cirilo_bateria_isolada.mp3',
                    baixo:          'https://archive.org/download/poderoso_deus_ao_vivo_2024_-_antonio_cirilo_sem_voz/poderoso_deus_ao_vivo_2024_-_antonio_cirilo_sem_baixo.mp3',
                    baixo_isolado:  'https://archive.org/download/poderoso_deus_ao_vivo_2024_-_antonio_cirilo_sem_voz/poderoso_deus_ao_vivo_2024_-_antonio_cirilo_baixo_isolado.mp3'
                }
            }
        ];

        /* Estrutura dos instrumentos e faixas */
        const INSTRUMENTOS = [
            { id: 'canto',  botao: 'Canto',            nome: 'Canto',       faixas: [ { chave: 'canto',  rotulo: 'Canto / Vocal' } ] },
            { id: 'violao', botao: 'Toco violão',      nome: 'Violão',      faixas: [ { chave: 'violao', rotulo: 'Padrão' }, { chave: 'violao_isolado', rotulo: 'Violão isolado' } ] },
            { id: 'cajon',  botao: 'Toco cajon',       nome: 'Cajon',       faixas: [ { chave: 'cajon',  rotulo: 'Padrão' }, { chave: 'cajon_isolado',  rotulo: 'Cajon isolado' } ] },
            { id: 'baixo',  botao: 'Toco contrabaixo', nome: 'Contrabaixo', faixas: [ { chave: 'baixo',  rotulo: 'Padrão' }, { chave: 'baixo_isolado',  rotulo: 'Contrabaixo isolado' } ] }
        ];

        /* Converte links comuns de compartilhamento em links de reprodução direta */
        function linkDireto(url) {
            url = (url || '').trim();
            if (!url) return '';
            const m = url.match(/drive\.google\.com\/file\/d\/([^/?#]+)/) || url.match(/drive\.google\.com\/open\?id=([^&#]+)/);
            if (m) return `https://drive.google.com/uc?export=download&id=${m[1]}`;
            if (/dropbox\.com/.test(url)) {
                if (/[?&]dl=[01]/.test(url)) return url.replace(/([?&])dl=[01]/, '$1raw=1');
                if (!/[?&]raw=1/.test(url)) return url + (url.includes('?') ? '&raw=1' : '?raw=1');
            }
            return url;
        }

        /* ---------- Montagem da página ---------- */
        function render() {
            document.getElementById('lista-musicas').innerHTML = REPERTORIO.map((m, i) => {
                const botoes = INSTRUMENTOS.map(inst =>
                    `<button class="btn-instrument" data-acao="instrumento" data-inst="${inst.id}">${inst.botao}</button>`
                ).join('');

                const submenus = INSTRUMENTOS.filter(inst => inst.faixas.length > 1).map(inst => `
                    <div class="sub-group" data-submenu="${inst.id}">
                        <span>${inst.nome}:</span>
                        ${inst.faixas.map(f => `<button class="btn-sub" data-acao="faixa" data-inst="${inst.id}" data-chave="${f.chave}">${f.rotulo}</button>`).join('')}
                    </div>`).join('');

                return `
                <div class="song-card" data-index="${i}">
                    <h2 class="song-title">${i + 1}. ${m.nome}</h2>
                    <div class="instruments-grid">${botoes}</div>
                    ${submenus}
                    <div class="player-section">
                        <div class="player-status">Selecione uma opção acima para escolher a trilha</div>
                        <a class="btn-ouvir" href="#" target="_blank" rel="noopener">▶ Ouvir trilha</a>
                    </div>
                </div>`;
            }).join('');
        }

        /* ---------- Player ---------- */
        function tocar(card, chave, descricao) {
            const musica = REPERTORIO[card.dataset.index];
            const link = card.querySelector('.btn-ouvir');
            const status = card.querySelector('.player-status');
            const url = linkDireto(musica.links[chave]);

            if (!url) {
                link.classList.remove('show');
                status.textContent = `${descricao} - Faixa indisponível`;
                status.classList.add('warn');
                return;
            }

            status.classList.remove('warn');
            status.textContent = descricao;
            link.href = url;
            link.classList.add('show');
        }

        function descricaoFaixa(instId, chave) {
            const inst = INSTRUMENTOS.find(i => i.id === instId);
            const faixa = inst.faixas.find(f => f.chave === chave);
            return inst.faixas.length > 1 ? `Trilha: ${inst.nome} - ${faixa.rotulo}` : `Trilha: ${faixa.rotulo}`;
        }


        /* ---------- Eventos ---------- */
        document.getElementById('lista-musicas').addEventListener('click', e => {
            const btn = e.target.closest('[data-acao]');
            if (!btn) return;
            const card = btn.closest('.song-card');

            if (btn.dataset.acao === 'instrumento') {
                const instId = btn.dataset.inst;
                const inst = INSTRUMENTOS.find(i => i.id === instId);
                card.querySelectorAll('.btn-instrument, .btn-sub').forEach(b => b.classList.remove('active'));
                card.querySelectorAll('.sub-group').forEach(s => s.classList.remove('show'));
                btn.classList.add('active');

                const chavePadrao = inst.faixas[0].chave;
                const sub = card.querySelector(`[data-submenu="${instId}"]`);
                if (sub) {
                    sub.classList.add('show');
                    sub.querySelector(`[data-chave="${chavePadrao}"]`).classList.add('active');
                }
                tocar(card, chavePadrao, descricaoFaixa(instId, chavePadrao));
            }

            if (btn.dataset.acao === 'faixa') {
                btn.closest('.sub-group').querySelectorAll('.btn-sub').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                tocar(card, btn.dataset.chave, descricaoFaixa(btn.dataset.inst, btn.dataset.chave));
            }
        });

        render();
    </script>
</body>
</html>
